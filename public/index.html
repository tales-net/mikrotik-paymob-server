<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>💳 صفحة الدفع</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      animation: fadeIn 0.8s ease-in-out;
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #34495e;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus, select:focus {
      border-color: #27ae60;
      outline: none;
      box-shadow: 0px 0px 6px rgba(39,174,96,0.3);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
      font-weight: bold;
    }
    button:hover {
      background: #219150;
    }
    .note {
      font-size: 13px;
      color: #7f8c8d;
      text-align: center;
      margin-top: 15px;
    }
    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }
    .logos img {
      height: 35px;
      object-fit: contain;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💳 ادفع الآن</h2>
    <form id="paymentForm">
      <div class="form-group">
        <label>رقم المحفظة / البطاقة</label>
        <input type="text" name="account" required>
      </div>

      <div class="form-group">
        <label>تاريخ الانتهاء</label>
        <input type="text" name="expiry" placeholder="MM/YY">
      </div>

      <div class="form-group">
        <label>رمز CVV</label>
        <input type="text" name="cvv" maxlength="3">
      </div>

      <div class="form-group">
        <label>طريقة الدفع</label>
        <select name="method">
          <option value="wallet">محفظة</option>
          <option value="card">كارت</option>
          <option value="valu">ValU</option>
          <option value="aman">Aman</option>
          <option value="seven">Seven</option>
        </select>
      </div>

      <div class="form-group">
        <label>المبلغ</label>
        <input type="number" name="amount" required>
      </div>

      <button type="submit">✅ ادفع الآن</button>
    </form>
    <p class="note">⚠️ بياناتك تُستخدم فقط لإتمام عملية الدفع عبر Paymob</p>

    <!-- شعارات الدفع الرسمية -->
    <div class="logos">
      <img src="https://seeklogo.com/images/P/paymob-logo-9E1E7C9F6D-seeklogo.com.png" alt="Paymob">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Central_Bank_of_Egypt_logo.png" alt="البنك المركزي المصري">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" alt="Visa">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
    </div>
  </div>

  <script>
    document.getElementById("paymentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());

      const res = await fetch("/api/pay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      try {
        const result = await res.json();
        if (result.payment_url) {
          window.location.href = result.payment_url; // تحويل لصفحة Paymob
        }
      } catch {
        const html = await res.text();
        document.body.innerHTML = html; // عرض IFrame مباشرة
      }
    });
  </script>
</body>
</html>
