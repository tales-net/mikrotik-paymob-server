<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>💳 صفحة الدفع</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 420px;
      background: #fff; padding: 30px;
      border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; margin-bottom: 25px; color: #2c3e50; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #34495e; }
    input, select {
      width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus, select:focus { border-color: #27ae60; outline: none; box-shadow: 0px 0px 6px rgba(39,174,96,0.3); }
    button {
      width: 100%; padding: 14px; background: #27ae60; color: #fff; border: none;
      border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #219150; }
    .note { font-size: 13px; color: #7f8c8d; text-align: center; margin-top: 15px; }
    .alert { font-size: 14px; color: #e74c3c; text-align: center; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>💳 ادفع الآن</h2>

    <!-- تنبيه للمستخدم -->
    <div class="alert">
      ⚠️ عند اختيار الدفع بالكارت، سيتم إدخال بيانات البطاقة داخل بوابة Paymob الرسمية (IFrame) بعد الضغط على "ادفع الآن".  
      لا تدخل بيانات البطاقة هنا في النموذج، هذه الحقول للعرض فقط.
    </div>

    <form id="paymentForm">
      <!-- محفظة -->
      <div class="form-group wallet-only">
        <label>رقم المحفظة</label>
        <input type="text" name="phone" placeholder="01234567890">
      </div>

      <!-- كارت (للتوضيح فقط) -->
      <div class="form-group card-only" style="display:none;">
        <label>رقم البطاقة (سيتم إدخاله في IFrame)</label>
        <input type="text" disabled placeholder="**** **** **** ****">
      </div>

      <div class="form-group card-only" style="display:none;">
        <label>تاريخ الانتهاء (MM/YY)</label>
        <input type="text" disabled placeholder="MM/YY">
      </div>

      <div class="form-group card-only" style="display:none;">
        <label>رمز CVV</label>
        <input type="text" disabled placeholder="***">
      </div>

      <!-- طريقة الدفع -->
      <div class="form-group">
        <label>طريقة الدفع</label>
        <select name="method" id="method">
          <option value="wallet">محفظة</option>
          <option value="card">كارت</option>
          <option value="valu">ValU</option>
          <option value="aman">Aman</option>
          <option value="seven">Seven</option>
        </select>
      </div>

      <!-- المبلغ -->
      <div class="form-group">
        <label>المبلغ</label>
        <input type="number" name="amount" min="1" required>
      </div>

      <button type="submit">✅ ادفع الآن</button>
    </form>

    <p class="note">⚠️ بياناتك تُستخدم فقط لإتمام عملية الدفع عبر Paymob</p>
  </div>

  <script>
    const methodSelect = document.getElementById("method");
    const walletFields = document.querySelectorAll(".wallet-only");
    const cardFields = document.querySelectorAll(".card-only");

    methodSelect.addEventListener("change", () => {
      if (methodSelect.value === "wallet") {
        walletFields.forEach(el => el.style.display = "block");
        cardFields.forEach(el => el.style.display = "none");
      } else {
        walletFields.forEach(el => el.style.display = "none");
        cardFields.forEach(el => el.style.display = "block");
      }
    });

    document.getElementById("paymentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());

      const res = await fetch("/api/pay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      try {
        const result = await res.json();
        if (result.payment_url) {
          window.location.href = result.payment_url;
        }
      } catch {
        const html = await res.text();
        document.body.innerHTML = html;
      }
    });
  </script>
</body>
</html>
